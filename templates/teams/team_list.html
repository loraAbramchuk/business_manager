{% extends "base.html" %}

{% block content %}
<h1>Мои команды</h1>

{% for team in teams %}
<div class="card">
    <a href="{% url 'team_detail' team.id %}"><b>{{ team.name }}</b></a>
</div>
{% empty %}
<p>Вы пока не состоите ни в одной команде. <a href="{% url 'team_create' %}">Создать</a> или <a href="{% url 'join_team' %}">войти по коду</a>.</p>
{% endfor %}
{% endblock %}
