{% extends "base.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Редактирование задачи{% else %}Новая задача{% endif %}</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Сохранить</button>
        <a class="button button--secondary" href="{% url 'task_list' %}">К списку</a>
    </form>
</div>
{% endblock %}
